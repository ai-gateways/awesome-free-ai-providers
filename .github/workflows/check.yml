name: Check main

# Safety net for direct pushes to main: format checks and awesome-lint, no network calls.
on:
  push:
    branches: [main]
    paths: [README.md, contributing.md, .github/scripts/review.py]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check README.md
        run: python3 .github/scripts/review.py check README.md --lint
